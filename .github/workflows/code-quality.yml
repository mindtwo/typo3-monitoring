name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pint:
    runs-on: ubuntu-latest
    name: Code style (Pint)

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer update --no-interaction --no-progress

      - run: vendor/bin/pint --test

  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both supported majors: TYPO3 12 ships DBAL 3 / Symfony 6.4, TYPO3 13 DBAL 4 / Symfony 7.
        typo3: ['^12.4', '^13.4']

    name: Static analysis (PHPStan level 8 · TYPO3 ${{ matrix.typo3 }})

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, intl, mbstring
          coverage: none

      - name: Pin the TYPO3 major under analysis
        run: composer require "typo3/cms-core:${{ matrix.typo3 }}" --no-update --no-interaction

      - run: composer update --no-interaction --no-progress

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
