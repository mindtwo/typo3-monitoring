name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        typo3: ['^12.4', '^13.4']
        include:
          # TYPO3 12.4 is the last branch that still runs on PHP 8.1; 13.4 needs 8.2+.
          - php: '8.1'
            typo3: '^12.4'

    name: PHP ${{ matrix.php }} · TYPO3 ${{ matrix.typo3 }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, intl, mbstring
          coverage: none

      - name: Pin the TYPO3 major under test
        run: composer require "typo3/cms-core:${{ matrix.typo3 }}" --no-update --no-interaction

      - run: composer update --prefer-stable --no-interaction --no-progress

      - run: vendor/bin/pest --ci
